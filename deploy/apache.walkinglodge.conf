<VirtualHost *:80>
    ServerName walkinglodge.com
    ServerAlias www.walkinglodge.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120

    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ProxyPass / http://127.0.0.1:3000/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:3000/

    LimitRequestBody 6291456

    ErrorLog ${APACHE_LOG_DIR}/walkinglodge-error.log
    CustomLog ${APACHE_LOG_DIR}/walkinglodge-access.log combined
</VirtualHost>
